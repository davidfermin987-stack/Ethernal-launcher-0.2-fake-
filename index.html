<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethernal Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      background: radial-gradient(circle at center, #0a0a1a 0%, #01010a 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    /* Fondo animado estilo neblina azul */
    .background {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(0, 40, 255, 0.3), transparent 70%),
                  radial-gradient(circle at 70% 70%, rgba(120, 0, 255, 0.2), transparent 70%);
      filter: blur(60px);
      animation: move-bg 20s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes move-bg {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-20%, -20%) scale(1.2); }
    }

    /* Barra lateral */
    .sidebar {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 2;
    }

    .sidebar button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1.5em;
      cursor: pointer;
      transition: 0.3s;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
    }

    /* Contenedor central */
    .main {
      position: relative;
      text-align: center;
      z-index: 2;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 25px rgba(0, 255, 255, 0.4));
    }

    h1 {
      font-size: 3em;
      font-weight: 700;
      letter-spacing: 2px;
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      margin-bottom: 50px;
    }

    /* Botón de Play */
    .play-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 20px;
      padding: 15px 60px;
      font-size: 1.2em;
      color: white;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .play-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
    }

    /* Adaptable */
    @media (max-width: 768px) {
      h1 { font-size: 2em; }
      .logo { width: 130px; }
      .play-btn { padding: 12px 40px; font-size: 1em; }
      .sidebar { left: 10px; }
      .sidebar button { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="sidebar">
    <button>＋</button>
    <button>👤</button>
  </div>

  <div class="main">
    <img src="logo.png" alt="Logo Ethernal" class="logo">
    <h1>ETHERNAL LAUNCHER</h1>
    <button class="play-btn" onclick="iniciarMinecraft()">JUGAR</button>
  </div>

  <script>
    function iniciarMinecraft() {
      const servidor = "minecraft://?addExternalServer=Infernal Evento|na81.aternos.me:60240";
      window.location.href = servidor;
    }
  </script>
</body>
</html>
